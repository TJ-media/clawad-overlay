name: advertiser-preview-pages

on:
  push:
    branches: [main]
    paths:
      - ".github/pages/index.html"
      - ".github/workflows/advertiser-preview-pages.yml"
      - "apps/client-desktop/advertiser-preview/**"
      - "apps/client-desktop/themes/clawad/LICENSE"
      - "apps/client-desktop/themes/clawad/assets/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: advertiser-preview-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static artifact
        run: |
          mkdir -p _site/advertiser-preview _site/themes/clawad
          cp .github/pages/index.html _site/index.html
          cp -R apps/client-desktop/advertiser-preview/. _site/advertiser-preview/
          cp -R apps/client-desktop/themes/clawad/assets _site/themes/clawad/assets
          cp apps/client-desktop/themes/clawad/LICENSE _site/themes/clawad/LICENSE

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
