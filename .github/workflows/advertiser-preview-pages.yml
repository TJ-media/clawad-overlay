name: advertiser-preview-pages

# 소재 미리보기 본체는 clawad 저장소의 user-web으로 옮겼다 (CLAW-248).
# 여기 남은 것은 옛 주소를 새 주소로 넘기는 한 장뿐이다 — 지우면 이미 이 링크를 받아 간
# 광고주에게 404가 뜨고, 그대로 두면 옛 화면이 계좌·단가를 두 벌로 말한다.

on:
  push:
    branches: [main]
    paths:
      - ".github/pages/index.html"
      - ".github/workflows/advertiser-preview-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: advertiser-preview-pages
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static artifact
        run: |
          mkdir -p _site/advertiser-preview
          cp .github/pages/index.html _site/index.html
          # 옛 경로(/advertiser-preview/)로 직접 들어온 링크도 같은 곳으로 넘긴다.
          cp .github/pages/index.html _site/advertiser-preview/index.html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
