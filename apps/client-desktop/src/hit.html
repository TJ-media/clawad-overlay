<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- 제목이 없으면 창 제목이 app.getName()으로 떨어져 upstream 이름이 노출된다 (CLAW-126). -->
  <title>Claw-Ad Hit Area</title>
  <style>
    * { margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: rgba(0,0,0,0.004); }
    #hit-area { width: 100%; height: 100%; cursor: grab; }
    #hit-area.dragging { cursor: grabbing; }
  </style>
</head>
<body>
  <div id="hit-area"></div>
  <script src="hit-renderer.js"></script>
</body>
</html>
