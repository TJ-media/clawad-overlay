<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'" />
    <title>ClawAd</title>
    <style>
      /* 오버레이 광고 한 줄. 배경은 투명하고 캡슐만 보인다. */
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        /* 창 전체가 클릭을 통과한다 (setIgnoreMouseEvents와 이중 방어). */
        pointer-events: none;
        user-select: none;
        -webkit-user-select: none;
      }

      #strip {
        display: flex;
        align-items: center;
        gap: 6px;
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        padding: 0 10px;
        border-radius: 999px;
        background: rgba(24, 24, 27, 0.82);
        color: #f4f4f5;
        font: 12px/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
        opacity: 0;
        transition: opacity 160ms ease-out;
      }

      #strip.visible {
        opacity: 1;
      }

      /* [광고] 표기는 표시광고법 요건이다. 마크업에 고정해 광고 문구와 무관하게 항상 렌더된다.
         제거·변경 금지 (clawad-overlay CLAUDE.md §4). */
      #label {
        flex: 0 0 auto;
        font-weight: 700;
        color: #fde047;
      }

      #text {
        flex: 1 1 auto;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      #brand {
        flex: 0 0 auto;
        max-width: 35%;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        color: #a1a1aa;
      }

      #brand:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="strip">
      <span id="label">[광고]</span>
      <span id="text"></span>
      <span id="brand"></span>
    </div>
    <script src="clawad-ad-renderer.js"></script>
  </body>
</html>
